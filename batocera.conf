## ------------------------------------------------------------------
## Profil écran 4K + optimisations Ryzen 5 5560U / Vega 6 (2026-09-17)
## Sortie 3840x2160 pour tous les systèmes (global.videomode) ; le coût
## GPU est piloté par la résolution interne de chaque émulateur.
## ------------------------------------------------------------------
# --- 8/16 bits & portables : run-ahead 1 frame (2e instance) => latence -1 frame
nes.runahead=2
nes.secondinstance=1
snes.runahead=2
snes.secondinstance=1
megadrive.runahead=2
megadrive.secondinstance=1
mastersystem.runahead=1
mastersystem.secondinstance=1
gamegear.runahead=1
gamegear.secondinstance=1
sega32x.runahead=1
sega32x.secondinstance=1
pcengine.runahead=1
pcengine.secondinstance=1
gb.runahead=1
gb.secondinstance=1
gbc.runahead=1
gbc.secondinstance=1
gba.runahead=1
gba.secondinstance=1
lynx.runahead=1
lynx.secondinstance=1
neogeo.runahead=1
neogeo.secondinstance=1
fbneo.runahead=1
fbneo.secondinstance=1
# --- N64 : mupen64plus-next (libretro) + GLideN64, 4x natif 4:3, filtrage 3-point authentique
n64.emulator=libretro
n64.core=mupen64plus-next
n64.mupen64plus-rdpPlugin=gliden64
n64.mupen64plus-rspPlugin=hle
n64.mupen64plus-43screensize=1280x960
n64.mupen64plus-BilinearMode=3point
n64.mupen64plus-MultiSampling=0
n64.mupen64plus-cpuCore=dynamic_recompiler
# --- PSX : swanstation (duckstation), 4x + PGXP
psx.core=swanstation
psx.swanstation_resolution_scale=4
psx.swanstation_pgxp=true
psx.swanstation_texture_filtering=Nearest
psx.swanstation_antialiasing=1
# --- Naomi / Naomi 2 / Atomiswave : flycast Vulkan, 2x (Naomi 2 = 1.5x, GPU double)
naomi.gfxbackend=vulkan
naomi.reicast_internal_resolution=1280x960
naomi.reicast_anisotropic_filtering=8
naomi2.gfxbackend=vulkan
naomi2.reicast_internal_resolution=960x720
naomi2.reicast_anisotropic_filtering=8
atomiswave.gfxbackend=vulkan
atomiswave.reicast_internal_resolution=1280x960
atomiswave.reicast_anisotropic_filtering=8
# --- GameCube / Wii : Vulkan, dual core (OFF par défaut dans Batocera !), ubershaders hybrides,
gamecube.gfxbackend=Vulkan
gamecube.dual_core=1
gamecube.ubershaders=2
gamecube.internal_resolution=3
gamecube.anisotropic_filtering=2
gamecube.antialiasing=0
gamecube.vsync=1
wii.gfxbackend=Vulkan
wii.dual_core=1
wii.ubershaders=2
wii.internal_resolution=2
wii.anisotropic_filtering=2
wii.antialiasing=0
wii.vsync=1
# --- prboom (ports)
prboom.prboom-resolution=1920x1200
# --- FSR 1 (2026-09-17) : upscale EASU+RCAS des cœurs 3D libretro vers le viewport 4K (set utilisateur /userdata/shaders/configs/fsr)
n64.shaderset=fsr
psx.shaderset=fsr
naomi.shaderset=fsr
naomi2.shaderset=fsr
atomiswave.shaderset=fsr

# --- HUD MangoHud compact (fps, frametime, GPU/CPU, horloge GPU, puissance) — sans log. hud=none pour le retirer.
global.hud=custom
global.hud_custom=position=top-left\nbackground_alpha=0.4\nlegacy_layout=false\nfont_size=18\nfps\nframetime\ngpu_stats\ngpu_core_clock\ngpu_temp\ncpu_stats\ncpu_mhz\ncpu_power\ncpu_temp

controllers.bt.idle_timeout=600
global.powermode=highperformance
global.batterymode=highperformance
