# Surcharge de /etc/triggerhappy/triggers.d/multimedia_keys.conf (chargée par
# S50triggerhappy si présente dans /userdata/system/configs/).
# Seule différence avec le fichier stock : le bouton d'alimentation passe par
# /userdata/system/power-button.sh (arrêt propre / menu ES) au lieu de
# batocera-shutdown (arrêt immédiat dès l'appui).
KEY_POWER       1               /userdata/system/power-button.sh 1
KEY_POWER       0               /userdata/system/power-button.sh 0
# display some information on X displays
KEY_F2          1               LANG=en_US HOME=/userdata/system XAUTHORITY=/var/lib/.Xauthority DISPLAY=$(getLocalXDisplay) /usr/bin/batocera-flash-screen 4 red "$(/usr/bin/batocera-info --short)"
KEY_F10+KEY_LEFTCTRL+KEY_LEFTALT 1 /etc/init.d/S31emulationstation stop
KEY_F11+KEY_LEFTCTRL+KEY_LEFTALT 1 chvt 1
KEY_LEFTMETA    1               batocera-brightness cycle
